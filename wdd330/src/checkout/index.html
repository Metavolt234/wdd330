<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Outside | Checkout</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="/index.html">Sleep Outside</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/index.html">Products</a>
        <a href="/cart/index.html">Cart</a>
      </nav>
    </div>
  </header>

  <main class="container page-space">
    <div class="page-heading">
      <p class="eyebrow">Almost there</p>
      <h1>Checkout</h1>
      <p>Enter your details to complete your order. All fields are required.</p>
    </div>

    <form id="checkout-form" class="checkout-card" novalidate>
      <div class="form-grid">
        <label>
          First name
          <input name="firstName" required minlength="2" autocomplete="given-name" placeholder="John">
        </label>
        <label>
          Last name
          <input name="lastName" required minlength="2" autocomplete="family-name" placeholder="Doe">
        </label>
        <label class="full-width">
          Email
          <input type="email" name="email" required autocomplete="email" placeholder="john@example.com">
        </label>
        <label>
          Address
          <input name="address" required minlength="5" autocomplete="street-address" placeholder="123 Main Street">
        </label>
        <label>
          City
          <input name="city" required minlength="2" autocomplete="address-level2" placeholder="Kampala">
        </label>
      </div>
      <button class="button" type="submit">Place Order</button>
    </form>
  </main>

  <footer class="site-footer"><p>&copy; 2026 Sleep Outside</p></footer>
  <script type="module" src="/js/checkout.js"></script>
</body>
</html>
